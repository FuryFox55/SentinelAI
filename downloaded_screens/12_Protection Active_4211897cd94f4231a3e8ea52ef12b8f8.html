<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary-container rounded-full blur-[120px] opacity-20 pulse-ring"></div>
</div>

<!-- Animated AI Shield Icon Area -->
<div class="relative w-48 h-48 flex items-center justify-center mb-8">
<!-- Pulse rings -->
<div class="absolute inset-0 bg-secondary/20 rounded-full blur-xl pulse-ring"></div>
<div class="absolute inset-4 bg-secondary-container/30 rounded-full blur-md pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Shield Icon Container -->
<div class="relative z-10 w-32 h-32 glass-card rounded-full flex items-center justify-center shield-glow border border-secondary-container/50 bg-surface/80">
<span class="material-symbols-outlined text-secondary-container" style="font-size: 64px; font-variation-settings: 'FILL' 1;">
                        shield_locked
                    </span>
</div>
</div>
<!-- Typography -->
<div class="space-y-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary-fixed tracking-tight">
                    Protection Active

                </p>
</div>

<div class="w-full pt-8">
<button class="w-full bg-gradient-to-r from-primary-container to-secondary-container hover:from-primary hover:to-secondary text-on-primary-container font-label-md text-label-md rounded-full py-4 px-8 transition-all duration-300 shadow-lg hover:shadow-[0_0_20px_rgba(1,221,247,0.4)] active:scale-95 flex items-center justify-center gap-2">
