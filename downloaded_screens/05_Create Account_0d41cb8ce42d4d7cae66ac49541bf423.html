<!DOCTYPE html><html lang="en" class="dark" style=""><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#8c909f",
                        "secondary": "#a9f1ff",
                        "primary": "#adc6ff",
                        "on-primary-fixed": "#001a41",
                        "tertiary": "#b9c7e4",
                        "inverse-on-surface": "#2d3133",
                        "on-tertiary": "#233148",
                        "surface-bright": "#363a3b",
                        "on-error": "#690005",
                        "surface-dim": "#101415",
                        "on-surface": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#39475f",
                        "on-background": "#e0e3e5",
                        "secondary-fixed-dim": "#00daf4",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#005ac1",
                        "surface-container-highest": "#323537",
                        "primary-fixed": "#d8e2ff",
                        "primary-container": "#1b72e8",
                        "on-secondary-container": "#005d69",
                        "surface-container-low": "#191c1e",
                        "surface": "#101415",
                        "on-primary-fixed-variant": "#004494",
                        "inverse-surface": "#e0e3e5",
                        "secondary-fixed": "#9defff",
                        "outline-variant": "#424754",
                        "surface-container-lowest": "#0b0f10",
                        "tertiary-fixed-dim": "#b9c7e4",
                        "surface-tint": "#adc6ff",
                        "on-tertiary-fixed": "#0d1c32",
                        "secondary-container": "#01ddf7",
                        "tertiary-fixed": "#d6e3ff",
                        "tertiary-container": "#687691",
                        "error-container": "#93000a",
                        "surface-variant": "#323537",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#001f24",
                        "on-secondary-fixed-variant": "#004f59",
                        "on-primary": "#002e69",
                        "primary-fixed-dim": "#adc6ff",
                        "on-tertiary-container": "#fffeff",
                        "on-secondary": "#00363e",
                        "on-primary-container": "#ffffff",
                        "on-surface-variant": "#c2c6d6",
                        "background": "#101415",
                        "surface-container-high": "#272a2c",
                        "surface-container": "#1d2022"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1440px",
                        "margin-mobile": "16px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Background Elements -->
<div class="bg-grid"></div>
<div class="glow-orb"></div>
<!-- Note: TopAppBar and BottomNavBar are SUPPRESSED based on the Semantic Shell Mandate for Transactional/Linear screens -->
<!-- Registration Container -->
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full glass-panel mb-4 shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: &quot;FILL&quot; 1;">security</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold tracking-tight text-on-surface mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join SENTINEL AI and safegaurd yourself</p>
</div>
<!-- Registration Form Card -->
<div class="glass-panel ambient-shadow rounded-xl p-6 md:p-8">
<form action="#" method="POST" class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label for="fullName" class="font-label-md text-label-md text-on-surface-variant">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required="" class="input-glass w-full rounded-lg h-12 pl-10 pr-4 font-body-md text-body-md placeholder:text-outline-variant">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label for="email" class="font-label-md text-label-md text-on-surface-variant">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input type="email" id="email" name="email" placeholder="jane@company.com" required="" class="input-glass w-full rounded-lg h-12 pl-10 pr-4 font-body-md text-body-md placeholder:text-outline-variant">
</div>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-1.5">
<label for="mobile" class="font-label-md text-label-md text-on-surface-variant">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">phone_iphone</span>
<input type="tel" id="mobile" name="mobile" placeholder="+1 (555) 000-0000" class="input-glass w-full rounded-lg h-12 pl-10 pr-4 font-body-md text-body-md placeholder:text-outline-variant">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label for="password" class="font-label-md text-label-md text-on-surface-variant">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input type="password" id="password" name="password" placeholder="••••••••" required="" class="input-glass w-full rounded-lg h-12 pl-10 pr-10 font-body-md text-body-md placeholder:text-outline-variant">
<button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" id="togglePassword">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
<!-- Validation Indicator (Example) -->

</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1.5">
<label for="confirmPassword" class="font-label-md text-label-md text-on-surface-variant">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock_reset</span>
<input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" class="input-glass w-full rounded-lg h-12 pl-10 pr-4 font-body-md text-body-md placeholder:text-outline-variant">
</div>
</div>
<!-- Submit Button -->
<button type="submit" class="btn-primary w-full h-12 rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 mt-2">
<span class="">Create Account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px flex-1 bg-white/10"></div>
<span class="font-body-md text-[12px] text-outline">or</span>
<div class="h-px flex-1 bg-white/10"></div>
</div>
<!-- Google Sign Up -->
<button type="button" class="btn-ghost w-full h-12 rounded-lg font-label-md text-label-md flex items-center justify-center gap-2">
<!-- Basic SVG for Google Icon to keep it self-contained without external image -->
<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="">Sign up with Google</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="text-center mt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a href="#" class="text-secondary hover:text-secondary-fixed transition-colors font-semibold">Login here</a>
</p>
</div>
</main>
<script>
        // Simple Password Toggle Interaction
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
