<div class="ambient-glow"></div>
<!-- Login Container -->
<main class="w-full max-w-md px-margin-mobile md:px-0 relative z-10 flex flex-col items-center">
<!-- Brand Logo (TopAppBar styling anchor reference) -->
<div class="flex items-center gap-3 mb-8">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">security</span>

</div>
<form class="flex flex-col gap-5 mt-2" action="#" method="POST">
<!-- Email Field -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-0 top-3 text-outline group-focus-within:text-secondary transition-colors">mail</span>
<input type="email" id="email" name="email" placeholder="Email" class="glass-input w-full pl-10 pr-4 py-3 font-body-md text-body-md rounded-t-lg" required="">
</div>
<!-- Password Field -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-0 top-3 text-outline group-focus-within:text-secondary transition-colors">lock</span>
<input type="password" id="password" name="password" placeholder="Password" class="glass-input w-full pl-10 pr-4 py-3 font-body-md text-body-md rounded-t-lg" required="">
<button type="button" class="absolute right-0 top-3 text-outline hover:text-on-surface transition-colors focus:outline-none">
<span class="material-symbols-outlined text-sm">visibility_off</span>
</button>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input type="checkbox" class="custom-checkbox">
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a href="#" class="font-body-md text-body-md text-secondary hover:text-secondary-fixed transition-colors">Forgot Password?</a>
</div>

<button type="submit" class="btn-primary w-full py-3 mt-4 rounded-lg font-label-md text-label-md text-on-primary-container flex justify-center items-center gap-2 shadow-lg">

<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink-0 mx-4 text-outline font-label-md text-label-md uppercase">Or connect via</span>
<div class="flex-grow border-t border-white/10"></div>
</div>

</button>

<script>
        // Simple ambient interaction for password visibility
        document.querySelector('button[type="button"]').addEventListener('click', function(e) {
            // Find closest input, skip if it's not the password field (like SSO or Bio)
            const input = this.previousElementSibling;
            if(input && input.tagName === 'INPUT' && (input.type === 'password' || input.type === 'text')) {
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.classList.add('text-secondary');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.classList.remove('text-secondary');
                }
            }
        });
    </script>
