</p>
<!-- OTP Input Grid -->

<script>
        // Simple OTP input logic for UX
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            // Allow pasting full codes
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                pasteData.split('').forEach((char, i) => {
                    if(inputs[i]) {
                        inputs[i].value = char;
                        if(i < inputs.length - 1) inputs[i+1].focus();
                        else inputs[i].blur();
                    }
                });
            });
        });

        // Simple Timer Simulation
        let timeLeft = 45;
        const timerEl = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerEl.textContent = `00:${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerEl.parentElement.innerHTML = 'Code expired';
                resendBtn.disabled = false;
                resendBtn.classList.add('text-primary');
                resendBtn.classList.remove('text-on-surface-variant');
            }
        }, 1000);
    </script>
